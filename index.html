<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renato IPTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10,10,14,.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #e50914;
      letter-spacing: .5px;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: #fff;
    }

    .nav-btn {
      background: #1c1c23;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
    }

    .nav-btn:hover {
      background: #292932;
    }

    /* CONTEÚDO */
    .main {
      padding-top: 74px;
      padding-bottom: 40px;
    }

    /* BUSCA */
    .search-box {
      padding: 10px 16px;
    }

    .search-box input {
      width: 100%;
      background: #17171d;
      border: 1px solid #2b2b34;
      border-radius: 10px;
      padding: 13px 15px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    /* BANNER */
    .hero {
      margin: 8px 16px 16px;
      min-height: 180px;
      border-radius: 14px;
      background:
        linear-gradient(
          to right,
          rgba(0,0,0,.9),
          rgba(0,0,0,.3)
        ),
        linear-gradient(135deg, #e50914, #16161d);
      display: flex;
      align-items: flex-end;
      padding: 22px;
      overflow: hidden;
    }

    .hero-content h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .hero-content p {
      color: #ddd;
      font-size: 14px;
    }

    /* ABAS */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 16px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      background: #18181f;
      color: #ccc;
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 13px;
    }

    .tab.active {
      background: #e50914;
      color: white;
    }

    /* TÍTULO DA CATEGORIA */
    .section-title {
      padding: 8px 16px 12px;
      font-size: 19px;
      font-weight: 700;
    }

    /* ============================
       GRADE DE CONTEÚDO
       ============================ */

    .carousel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 16px 22px;
      width: 100%;
    }

    /* CARD */
    .card {
      width: 100%;
      min-width: 0;
      height: 220px;
      background: #15151b;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid #24242c;
      transition: transform .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #e50914;
    }

    .card-img {
      display: block;
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #222;
    }

    .card-title {
      padding: 8px 9px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-badge {
      position: absolute;
      top: 7px;
      left: 7px;
      background: #e50914;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: bold;
      z-index: 2;
    }

    /* TABLET */
    @media (min-width: 600px) {
      .carousel {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        height: 240px;
      }

      .card-img {
        height: 180px;
      }
    }

    /* DESKTOP */
    @media (min-width: 900px) {
      .carousel {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 15px;
      }

      .card {
        height: 260px;
      }

      .card-img {
        height: 195px;
      }
    }

    /* TELAS GRANDES */
    @media (min-width: 1400px) {
      .carousel {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 900px;
      background: #111116;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #292932;
      position: relative;
    }

    .modal-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292932;
    }

    .modal-header h2 {
      font-size: 16px;
    }

    .close {
      background: #25252d;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 18px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    /* LOGIN */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: #08080b;
      z-index: 5000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #15151b;
      border: 1px solid #292932;
      border-radius: 14px;
      padding: 25px;
    }

    .login-box h2 {
      text-align: center;
      color: #e50914;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #30303a;
      background: #0d0d11;
      color: #fff;
      outline: none;
    }

    .login-button {
      width: 100%;
      background: #e50914;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #b80710;
    }

    .login-message {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      color: #bbb;
    }

    .hidden {
      display: none !important;
    }

    /* M3U */
    .m3u-content {
      padding: 18px;
    }

    .m3u-content input {
      width: 100%;
      background: #0c0c10;
      border: 1px solid #30303a;
      color: white;
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .m3u-button {
      background: #e50914;
      padding: 11px 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222229;
      border: 1px solid #33333d;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      z-index: 9000;
      display: none;
      font-size: 13px;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">

      <h2>RENATO IPTV</h2>

      <input
        type="email"
        id="email"
        placeholder="E-mail"
      >

      <input
        type="password"
        id="password"
        placeholder="Senha"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        ENTRAR
      </button>

      <button
        class="login-button"
        style="background:#292932;margin-top:10px;"
        onclick="toggleSignup()"
      >
        CRIAR CONTA
      </button>

      <div id="loginMessage" class="login-message"></div>

    </div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      RENATO IPTV
    </div>

    <div class="nav-buttons">

      <button
        class="nav-btn"
        onclick="openM3U()"
      >
        + Lista
      </button>

      <button
        class="nav-btn"
        onclick="logout()"
      >
        Sair
      </button>

    </div>

  </nav>

  <!-- MAIN -->
  <main class="main">

    <!-- BUSCA -->
    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="Pesquisar canais, filmes, séries..."
        oninput="handleSearch(this.value)"
      >

    </div>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <h1>RENATO IPTV</h1>

        <p>
          Seus canais, filmes e séries em um só lugar.
        </p>

      </div>

    </section>

    <!-- TABS -->
    <div class="tabs">

      <button
        class="tab active"
        onclick="filterCat('todos', this)"
      >
        Todos
      </button>

      <button
        class="tab"
        onclick="filterCat('canais', this)"
      >
        Canais
      </button>

      <button
        class="tab"
        onclick="filterCat('filmes', this)"
      >
        Filmes
      </button>

      <button
        class="tab"
        onclick="filterCat('series', this)"
      >
        Séries
      </button>

      <button
        class="tab"
        onclick="filterCat('novelas', this)"
      >
        Novelas
      </button>

    </div>

    <!-- CONTEÚDO -->
    <div id="content"></div>

  </main>

  <!-- PLAYER -->
  <div
    id="playerModal"
    class="modal"
    onclick="closePlayer(event)"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="playerTitle">
          Reproduzindo
        </h2>

        <button
          class="close"
          onclick="closePlayer()"
        >
          ×
        </button>

      </div>

      <video
        id="video"
        controls
        playsinline
      ></video>

    </div>

  </div>

  <!-- M3U -->
  <div
    id="m3uModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          Adicionar lista M3U
        </h2>

        <button
          class="close"
          onclick="closeM3U()"
        >
          ×
        </button>

      </div>

      <div class="m3u-content">

        <input
          type="text"
          id="m3uUrl"
          placeholder="Cole aqui a URL da sua lista M3U"
        >

        <button
          class="m3u-button"
          onclick="loadUrl()"
        >
          CARREGAR URL
        </button>

        <br><br>

        <input
          type="file"
          id="m3uFile"
          accept=".m3u,.m3u8,.txt"
          onchange="uploadFile()"
        >

      </div>

    </div>

  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>


  <script>

    /* ==========================================
       SUPABASE
       ========================================== */

    const SUPABASE_URL =
      "COLOQUE_AQUI_SEU_SUPABASE_URL";

    const SUPABASE_ANON_KEY =
      "COLOQUE_AQUI_SUA_SUPABASE_ANON_KEY";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ==========================================
       VARIÁVEIS
       ========================================== */

    let isSignUpMode = false;

    let list = [];

    let currentFilter = "todos";

    let hls = null;

    let hero = null;


    /* ==========================================
       DEMO M3U
       ========================================== */

    const demoM3U = `#EXTM3U
#EXTINF:-1 tvg-logo="" group-title="Filmes",Filme Demo 1
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8

#EXTINF:-1 tvg-logo="" group-title="Filmes",Filme Demo 2
https://test-streams.mux.dev/test_001/stream.m3u8

#EXTINF:-1 tvg-logo="" group-title="Novelas",Novela Demo
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8

#EXTINF:-1 tvg-logo="" group-title="Séries",Série Demo
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8

#EXTINF:-1 tvg-logo="" group-title="Canais",Canal Demo
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;


    /* ==========================================
       TOAST
       ========================================== */

    function toast(message) {

      const el =
        document.getElementById("toast");

      el.textContent = message;

      el.classList.add("show");

      setTimeout(() => {

        el.classList.remove("show");

      }, 3000);

    }


    /* ==========================================
       LOGIN
       ========================================== */

    function toggleSignup() {

      isSignUpMode = !isSignUpMode;

      const button =
        document.querySelector(".login-button");

      const buttons =
        document.querySelectorAll(".login-button");

      if (isSignUpMode) {

        buttons[0].textContent =
          "CRIAR CONTA";

        buttons[1].textContent =
          "VOLTAR PARA LOGIN";

      } else {

        buttons[0].textContent =
          "ENTRAR";

        buttons[1].textContent =
          "CRIAR CONTA";
      }

    }


    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      if (!email || !password) {

        message.textContent =
          "Preencha e-mail e senha.";

        return;
      }

      message.textContent =
        "Aguarde...";

      try {

        if (isSignUpMode) {

          const { error } =
            await supabaseClient.auth.signUp({
              email: email,
              password: password
            });

          if (error) throw error;

          message.textContent =
            "Conta criada. Verifique seu e-mail se necessário.";

          return;
        }

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

        document
          .getElementById("loginOverlay")
          .classList.add("hidden");

        toast("Login realizado com sucesso.");

        if (!list.length) {

          parse(demoM3U);

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Erro ao fazer login.";

      }

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document
        .getElementById("loginOverlay")
        .classList.remove("hidden");

    }


    async function checkAuth() {

      try {

        const { data } =
          await supabaseClient.auth.getSession();

        if (data.session) {

          document
            .getElementById("loginOverlay")
            .classList.add("hidden");

          parse(demoM3U);

        }

      } catch (error) {

        console.error(error);

      }

    }


    /* ==========================================
       PARSER M3U
       ========================================== */

    function parse(txt) {

      const lines =
        txt.split(/\r?\n/);

      const result = [];

      for (let i = 0; i < lines.length; i++) {

        const line =
          lines[i].trim();

        if (!line.startsWith("#EXTINF")) {
          continue;
        }

        const nextLine =
          lines[i + 1]
            ? lines[i + 1].trim()
            : "";

        if (!nextLine ||
            nextLine.startsWith("#")) {
          continue;
        }

        const nameMatch =
          line.match(/,(.*)$/);

        const name =
          nameMatch
            ? nameMatch[1].trim()
            : "Sem nome";

        const logoMatch =
          line.match(/tvg-logo="([^"]*)"/i);

        const groupMatch =
          line.match(/group-title="([^"]*)"/i);

        const logo =
          logoMatch
            ? logoMatch[1]
            : "";

        const group =
          groupMatch
            ? groupMatch[1]
            : "";

        const full =
          (
            name +
            " " +
            group +
            " " +
            line
          ).toLowerCase();

        let cat = "canais";

        if (
          full.includes("novela")
        ) {

          cat = "novelas";

        } else if (
          full.includes("serie") ||
          full.includes("série") ||
          /s\d{1,2}e\d{1,2}/i.test(full)
        ) {

          cat = "series";

        } else if (
          full.includes("filme") ||
          full.includes("movie") ||
          group.toLowerCase().includes("filmes")
        ) {

          cat = "filmes";

        }

        result.push({

          name: name,

          logo: logo,

          cat: cat,

          url: nextLine

        });

      }

      list = result;

      render(list);

      toast(
        result.length +
        " itens carregados."
      );

    }


    /* ==========================================
       RENDERIZAÇÃO EM GRADE
       ========================================== */

    function render(data) {

      const content =
        document.getElementById("content");

      content.innerHTML = "";

      const categories = [

        {
          key: "canais",
          title: "Canais"
        },

        {
          key: "filmes",
          title: "Filmes"
        },

        {
          key: "series",
          title: "Séries"
        },

        {
          key: "novelas",
          title: "Novelas"
        }

      ];

      categories.forEach(category => {

        const sub =
          data.filter(
            item =>
              item.cat === category.key
          );

        if (!sub.length) {
          return;
        }

        const title =
          document.createElement("div");

        title.className =
          "section-title";

        title.textContent =
          category.title +
          " (" +
          sub.length +
          ")";

        content.appendChild(title);


        /* GRADE */

        const grid =
          document.createElement("div");

        grid.className =
          "carousel";


        sub.forEach(item => {

          const card =
            document.createElement("div");

          card.className =
            "card";

          card.onclick = () => {

            play(
              item.url,
              item.name
            );

          };


          const badge =
            document.createElement("span");

          badge.className =
            "card-badge";

          badge.textContent =
            item.cat.toUpperCase();


          const img =
            document.createElement("img");

          img.className =
            "card-img";

          img.src =
            item.logo ||
            "https://via.placeholder.com/400x600/17171d/ffffff?text=RENATO+IPTV";

          img.onerror = () => {

            img.src =
              "https://via.placeholder.com/400x600/17171d/ffffff?text=RENATO+IPTV";

          };


          const titleEl =
            document.createElement("div");

          titleEl.className =
            "card-title";

          titleEl.textContent =
            item.name;


          card.appendChild(badge);

          card.appendChild(img);

          card.appendChild(titleEl);

          grid.appendChild(card);

        });


        content.appendChild(grid);

      });


      if (!content.innerHTML) {

        content.innerHTML = `
          <div
            style="
              padding:40px 20px;
              text-align:center;
              color:#888;
            "
          >
            Nenhum conteúdo encontrado.
          </div>
        `;

      }

    }


    /* ==========================================
       FILTRO
       ========================================== */

    function filterCat(
      cat,
      btn
    ) {

      currentFilter =
        cat;

      document
        .querySelectorAll(".tab")
        .forEach(button => {

          button.classList.remove(
            "active"
          );

        });

      if (btn) {

        btn.classList.add(
          "active"
        );

      }

      let data =
        list;

      if (cat !== "todos") {

        data =
          list.filter(
            item =>
              item.cat === cat
          );

      }

      const search =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      if (search) {

        data =
          data.filter(
            item =>
              item.name
                .toLowerCase()
                .includes(search)
          );

      }

      render(data);

    }


    /* ==========================================
       PESQUISA
       ========================================== */

    function handleSearch(value) {

      const search =
        value
          .trim()
          .toLowerCase();

      let data =
        list;

      if (
        currentFilter !==
        "todos"
      ) {

        data =
          data.filter(
            item =>
              item.cat ===
              currentFilter
          );

      }

      if (search) {

        data =
          data.filter(
            item =>
              item.name
                .toLowerCase()
                .includes(search)
          );

      }

      render(data);

    }


    /* ==========================================
       PLAYER
       ========================================== */

    function play(
      url,
      name
    ) {

      const modal =
        document.getElementById(
          "playerModal"
        );

      const video =
        document.getElementById(
          "video"
        );

      const title =
        document.getElementById(
          "playerTitle"
        );

      title.textContent =
        name ||
        "Reproduzindo";

      modal.classList.add(
        "show"
      );


      if (hls) {

        hls.destroy();

        hls = null;

      }

      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();


      if (
        Hls.isSupported() &&
        (
          url.includes(".m3u8") ||
          url.includes("m3u8")
        )
      ) {

        hls =
          new Hls();

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          () => {

            video.play()
              .catch(() => {});

          }
        );

      } else {

        video.src = url;

        video.play()
          .catch(() => {});

      }

    }


    function closePlayer(event) {

      if (
        event &&
        event.target !==
        event.currentTarget
      ) {

        return;

      }

      const modal =
        document.getElementById(
          "playerModal"
        );

      const video =
        document.getElementById(
          "video"
        );

      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();

      if (hls) {

        hls.destroy();

        hls = null;

      }

      modal.classList.remove(
        "show"
      );

    }


    /* ==========================================
       M3U
       ========================================== */

    function openM3U() {

      document
        .getElementById("m3uModal")
        .classList.add("show");

    }


    function closeM3U() {

      document
        .getElementById("m3uModal")
        .classList.remove("show");

    }


    async function loadUrl() {

      const url =
        document
          .getElementById("m3uUrl")
          .value
          .trim();

      if (!url) {

        toast(
          "Cole uma URL M3U."
        );

        return;

      }

      try {

        toast(
          "Carregando lista..."
        );

        const response =
          await fetch(url);

        if (!response.ok) {

          throw new Error(
            "Não foi possível carregar a lista."
          );

        }

        const text =
          await response.text();

        parse(text);

        closeM3U();

      } catch (error) {

        console.error(error);

        toast(
          "Erro ao carregar a lista M3U."
        );

      }

    }


    function uploadFile() {

      const file =
        document
          .getElementById("m3uFile")
          .files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          parse(
            event.target.result
          );

          closeM3U();

        };

      reader.readAsText(file);

    }


    /* ==========================================
       INICIALIZAÇÃO
       ========================================== */

    window.addEventListener(
      "load",
      () => {

        checkAuth();

      }
    );


    /* ==========================================
       ESC
       ========================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closePlayer();

          closeM3U();

        }

      }
    );

  </script>

</body>
</html>
