<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renato IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --red: #E50914;
      --dark: #141414;
      --card: #222;
      --text: #fff;
      --muted: #aaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: var(--dark); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    body { overflow-x: hidden; }
    button, input { font-family: inherit; }
    button { cursor: pointer; }

    /* LOGIN */
    #authScreen {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.92)), radial-gradient(circle at center, #3a0000, #050505 70%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box {
      width: 100%; max-width: 390px; background: rgba(20,20,20,.96);
      border: 1px solid #333; border-radius: 14px; padding: 28px 22px;
      box-shadow: 0 20px 70px rgba(0,0,0,.6);
    }
    .auth-logo { text-align: center; color: var(--red); font-size: 30px; font-weight: 900; margin-bottom: 8px; }
    .auth-subtitle { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 14px; }
    .auth-box input {
      width: 100%; height: 46px; border: 1px solid #444; border-radius: 7px;
      background: #111; color: #fff; padding: 0 13px; margin-bottom: 12px; outline: none;
    }
    .auth-box input:focus { border-color: var(--red); }
    .auth-btn {
      width: 100%; height: 46px; border: 0; border-radius: 7px;
      background: var(--red); color: white; font-weight: bold; font-size: 15px;
    }
    .auth-btn:hover { filter: brightness(1.1); }
    .auth-switch { text-align: center; color: #aaa; margin-top: 18px; font-size: 13px; }
    .auth-switch span { color: var(--red); cursor: pointer; font-weight: bold; }
    #authMessage { text-align: center; font-size: 13px; margin-top: 12px; color: #ff7777; min-height: 18px; }

    /* APP */
    #app { display: none; min-height: 100vh; }

    /* NAVBAR */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 1000;
      background: rgba(10,10,10,.97); display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #252525;
    }
    .logo { color: var(--red); font-size: 20px; font-weight: 900; white-space: nowrap; }
    .nav-actions { display: flex; align-items: center; gap: 7px; }
    .nav-btn {
      border: 1px solid #3b3b3b; background: #202020; color: white;
      border-radius: 6px; padding: 8px 11px; font-size: 12px;
    }
    .nav-btn:hover { background: #2d2d2d; }
    .nav-btn.primary { background: var(--red); border-color: var(--red); }

    /* SEARCH */
    .search-area {
      position: fixed; top: 60px; left: 0; right: 0; z-index: 900;
      background: #111; padding: 8px 12px; border-bottom: 1px solid #252525;
    }
    #searchInput {
      width: 100%; max-width: 650px; display: block; margin: auto; height: 40px;
      border: 1px solid #333; border-radius: 20px; background: #202020;
      color: #fff; padding: 0 17px; outline: none;
    }
    #searchInput:focus { border-color: var(--red); }

    /* HERO */
    .hero {
      margin-top: 116px; width: 100%; min-height: 270px; height: 43vh; max-height: 500px;
      background: linear-gradient(90deg, rgba(0,0,0,.95), rgba(0,0,0,.45), rgba(0,0,0,.75)),
                  linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)), #111;
      background-position: center; background-size: cover;
      display: flex; align-items: flex-end; padding: 35px 25px;
      position: relative; overflow: hidden;
    }
    .hero-content { max-width: 650px; z-index: 2; }
    .hero-title { font-size: clamp(28px, 5vw, 58px); font-weight: 900; margin-bottom: 10px; text-shadow: 0 3px 15px #000; }
    .hero-description { color: #ddd; font-size: 14px; margin-bottom: 18px; }
    .hero-play {
      background: white; color: #111; border: none; border-radius: 5px;
      padding: 11px 20px; font-weight: bold; font-size: 14px;
    }

    /* TABS */
    .tabs {
      position: sticky; top: 108px; z-index: 800; display: flex; gap: 7px;
      overflow-x: auto; padding: 12px 12px; background: rgba(20,20,20,.97);
      border-bottom: 1px solid #292929; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto; border: 1px solid #383838; background: #222; color: #bbb;
      border-radius: 18px; padding: 8px 14px; font-size: 13px;
    }
    .tab.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* CONTENT */
    #content { width: 100%; padding-top: 8px; }
    .section { width: 100%; margin-bottom: 10px; }
    .section-title { padding: 12px 12px 9px; font-size: 19px; font-weight: 800; }
    .section-title span { color: var(--red); }

    /* GRADE */
    .grid {
      width: 100%; display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 10px; padding: 0 10px 25px; align-items: start;
    }
    @media (min-width: 601px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 12px; padding-left: 16px; padding-right: 16px; }
    }
    @media (min-width: 901px) {
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; gap: 14px; }
    }
    @media (min-width: 1400px) {
      .grid { grid-template-columns: repeat(8, minmax(0, 1fr)) !important; }
    }

    /* CARD */
    .card {
      width: 100%; min-width: 0; background: var(--card); border-radius: 8px;
      overflow: hidden; border: 1px solid #2d2d2d;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      position: relative; cursor: pointer;
    }
    .card:hover { transform: translateY(-4px); border-color: #555; box-shadow: 0 8px 25px rgba(0,0,0,.45); }
    .card-img { display: block; width: 100%; aspect-ratio: 2 / 2.7; background: #111; object-fit: cover; }
    .card-info { padding: 8px; min-height: 53px; }
    .card-title {
      color: #fff; font-size: 12px; font-weight: bold; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-category { color: #888; font-size: 10px; margin-top: 4px; text-transform: uppercase; }
    .badge {
      position: absolute; top: 6px; left: 6px; background: var(--red); color: white;
      border-radius: 4px; font-size: 9px; font-weight: bold; padding: 4px 6px; z-index: 3;
    }

    /* EMPTY */
    .empty { text-align: center; color: #888; padding: 45px 20px; font-size: 14px; }
    .empty strong { color: #fff; display: block; margin-bottom: 8px; }

    /* MODAL M3U */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 5000;
      background: rgba(0,0,0,.82); align-items: center; justify-content: center; padding: 18px;
    }
    .modal-box { width: 100%; max-width: 500px; background: #181818; border: 1px solid #333; border-radius: 12px; padding: 20px; }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    .modal-box input[type="text"], .modal-box input[type="file"] { width: 100%; margin-bottom: 10px; }
    .modal-box input[type="text"] {
      height: 42px; background: #111; border: 1px solid #444; border-radius: 6px;
      color: white; padding: 0 12px; outline: none;
    }
    .modal-buttons { display: flex; gap: 8px; margin-top: 10px; }
    .modal-buttons button {
      flex: 1; height: 42px; border-radius: 6px; border: 1px solid #444;
      background: #292929; color: white;
    }
    .modal-buttons .red { background: var(--red); border-color: var(--red); }

    /* ============================================
       PLAYER LIMPO - BOTÃO VOLTAR INVISÍVEL
    ============================================ */
    #playerModal {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: #000; overflow: hidden;
    }

    .video-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    /* Vídeo preenche tudo */
    #video {
      display: block;
      background: #000;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Esconde controles nativos */
    #video::-webkit-media-controls {
      display: none !important;
    }

    /* Botão Voltar - INVISÍVEL por padrão */
    #closePlayer {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      border: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;                    /* invisível por padrão */
      pointer-events: none;          /* não clicável enquanto invisível */
      transition: opacity 0.3s ease;
    }

    /* Quando o botão está visível */
    #closePlayer.visible {
      opacity: 1;
      pointer-events: auto;          /* clicável quando visível */
    }

    /* RESPONSIVO */
    @media (max-width: 480px) {
      .navbar { padding: 0 10px; }
      .logo { font-size: 17px; }
      .nav-btn { padding: 7px 8px; font-size: 10px; }
      .hero { min-height: 230px; height: 34vh; padding: 25px 15px; }
      .hero-title { font-size: 28px; }
      .hero-description { font-size: 12px; }
      .section-title { font-size: 17px; }
      .card-info { padding: 6px; }
      .card-title { font-size: 10px; }
      .card-category { font-size: 8px; }
    }
  </style>
</head>
<body>

  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-logo">RENATO IPTV</div>
      <div class="auth-subtitle">Acesse sua programação</div>
      <input type="email" id="email" placeholder="E-mail" autocomplete="email">
      <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
      <button class="auth-btn" id="authButton">Entrar</button>
      <div class="auth-switch">
        <span id="authSwitch">Criar uma conta</span>
      </div>
      <div id="authMessage"></div>
    </div>
  </div>

  <div id="app">
    <nav class="navbar">
      <div class="logo">RENATO IPTV</div>
      <div class="nav-actions">
        <button class="nav-btn primary" id="addListBtn">+ Lista</button>
        <button class="nav-btn" id="logoutBtn">Sair</button>
      </div>
    </nav>

    <div class="search-area">
      <input type="search" id="searchInput" placeholder="🔎 Pesquisar canais, filmes, séries...">
    </div>

    <section class="hero" id="hero">
      <div class="hero-content">
        <div class="hero-title" id="heroTitle">RENATO IPTV</div>
        <div class="hero-description" id="heroDescription">Sua programação em um só lugar.</div>
        <button class="hero-play" id="heroPlay">▶ Assistir</button>
      </div>
    </section>

    <div class="tabs">
      <button class="tab active" data-filter="todos">Todos</button>
      <button class="tab" data-filter="canais">Canais</button>
      <button class="tab" data-filter="filmes">Filmes</button>
      <button class="tab" data-filter="series">Séries</button>
      <button class="tab" data-filter="novelas">Novelas</button>
    </div>

    <main id="content"></main>
  </div>

  <div class="modal" id="m3uModal">
    <div class="modal-box">
      <div class="modal-title">Adicionar lista M3U</div>
      <input type="text" id="m3uUrl" placeholder="Cole aqui a URL da lista M3U/M3U8">
      <input type="file" id="m3uFile" accept=".m3u,.m3u8,.txt">
      <div class="modal-buttons">
        <button id="closeM3u">Cancelar</button>
        <button class="red" id="loadM3u">Carregar lista</button>
      </div>
    </div>
  </div>

  <!-- PLAYER LIMPO -->
  <div id="playerModal">
    <button id="closePlayer">×</button>
    <div class="video-container">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
  </div>

  <script>
    /* =====================================================
       VARIÁVEIS
    ===================================================== */
    let currentUser = null;
    let list = [];
    let currentFilter = "todos";
    let searchTerm = "";
    let hls = null;
    let buttonVisible = false;

    /* =====================================================
       DEMO
    ===================================================== */
    const DEMO = `#EXTM3U
#EXTINF:-1 tvg-logo="https://dummyimage.com/300x450/222/fff&text=Canal+1" group-title="Canais",Canal Demo 1
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://dummyimage.com/300x450/333/fff&text=Canal+2" group-title="Canais",Canal Demo 2
https://test-streams.mux.dev/test_001/stream.m3u8
#EXTINF:-1 tvg-logo="https://dummyimage.com/300x450/555/fff&text=Filme+1" group-title="Filmes",Filme Demo 1
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://dummyimage.com/300x450/888/fff&text=Serie+1" group-title="Series",Serie Demo 1
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://dummyimage.com/300x450/bb0000/fff&text=Novela+1" group-title="Novelas",Novela Demo 1
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;

    /* =====================================================
       NORMALIZAÇÃO
    ===================================================== */
    function normalizeText(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    /* =====================================================
       CATEGORIA
    ===================================================== */
    function detectCategory(name, group) {
      const text = normalizeText(String(name || "") + " " + String(group || ""));
      if (text.includes("novela")) return "novelas";
      if (text.includes("serie") || text.includes("series") || text.includes("temporada") || text.includes("episodio") || /s\d{1,2}e\d{1,2}/i.test(text)) return "series";
      if (text.includes("filme") || text.includes("filmes") || text.includes("movie") || text.includes("movies") || text.includes("film") || text.includes("vod")) return "filmes";
      return "canais";
    }

    /* =====================================================
       PARSER M3U
    ===================================================== */
    function parseM3U(text) {
      const lines = String(text || "").split(/\r?\n/);
      const result = [];
      let item = null;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        if (line.toUpperCase().startsWith("#EXTINF:")) {
          const logoMatch = line.match(/tvg-logo\s*=\s*["']([^"']*)["']/i);
          const groupMatch = line.match(/group-title\s*=\s*["']([^"']*)["']/i);
          const comma = line.indexOf(",");
          let name = "Sem nome";
          if (comma !== -1) name = line.substring(comma + 1).trim();
          const logo = logoMatch ? logoMatch[1] : "";
          const group = groupMatch ? groupMatch[1] : "";
          item = {
            name: name || "Sem nome",
            logo: logo,
            group: group,
            cat: detectCategory(name, group),
            url: ""
          };
          continue;
        }
        if (line.startsWith("#")) continue;
        if (item && !line.startsWith("#")) {
          item.url = line;
          if (item.url) result.push({ ...item });
          item = null;
        }
      }
      return result;
    }

    /* =====================================================
       CARD
    ===================================================== */
    function createCard(item) {
      const index = list.indexOf(item);
      const logo = item.logo || "https://dummyimage.com/300x450/222/ffffff&text=RENATO+IPTV";
      return `
        <div class="card" data-index="${index}">
          <div class="badge">${escapeHtml(item.cat === "canais" ? "LIVE" : item.cat.toUpperCase())}</div>
          <img class="card-img" src="${escapeHtml(logo)}" alt="${escapeHtml(item.name)}" loading="lazy"
            onerror="this.onerror=null;this.src='https://dummyimage.com/300x450/222/ffffff&text=IPTV';">
          <div class="card-info">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-category">${escapeHtml(item.group || item.cat)}</div>
          </div>
        </div>`;
    }

    /* =====================================================
       RENDER
    ===================================================== */
    function render(data) {
      const content = document.getElementById("content");
      content.innerHTML = "";
      if (!data.length) {
        content.innerHTML = `<div class="empty"><strong>Nenhum conteúdo encontrado</strong>Tente outra pesquisa ou carregue uma lista M3U.</div>`;
        return;
      }
      const categories = [
        { id: "canais", title: "Canais" },
        { id: "filmes", title: "Filmes" },
        { id: "series", title: "Séries" },
        { id: "novelas", title: "Novelas" }
      ];
      if (currentFilter === "todos") {
        categories.forEach(category => {
          const items = data.filter(item => item.cat === category.id);
          if (!items.length) return;
          const section = document.createElement("section");
          section.className = "section";
          section.innerHTML = `
            <div class="section-title">${category.title} <span>(${items.length})</span></div>
            <div class="grid">${items.map(createCard).join("")}</div>`;
          content.appendChild(section);
        });
      } else {
        const category = categories.find(c => c.id === currentFilter);
        const title = category ? category.title : currentFilter;
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `
          <div class="section-title">${title} <span>(${data.length})</span></div>
          <div class="grid">${data.map(createCard).join("")}</div>`;
        content.appendChild(section);
      }
      content.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          const index = Number(card.dataset.index);
          const item = list[index];
          if (item) playVideo(item.url, item.name);
        });
      });
    }

    /* =====================================================
       FILTRAR
    ===================================================== */
    function updateView() {
      const normalizedSearch = normalizeText(searchTerm);
      let data = list.filter(item => {
        const text = normalizeText(item.name + " " + item.group);
        const categoryOK = currentFilter === "todos" || item.cat === currentFilter;
        const searchOK = !normalizedSearch || text.includes(normalizedSearch);
        return categoryOK && searchOK;
      });
      render(data);
    }

    /* =====================================================
       HERO
    ===================================================== */
    function updateHero() {
      const hero = document.getElementById("hero");
      const title = document.getElementById("heroTitle");
      const description = document.getElementById("heroDescription");
      if (!list.length) {
        hero.style.backgroundImage = "linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.5)),linear-gradient(135deg,#300,#111)";
        title.textContent = "RENATO IPTV";
        description.textContent = "Sua programação em um só lugar.";
        return;
      }
      const item = list[0];
      if (item.logo) {
        hero.style.backgroundImage = `linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.5),rgba(0,0,0,.8)),url("${item.logo}")`;
      }
      title.textContent = item.name;
      description.textContent = item.group || "Conteúdo disponível";
    }

    /* =====================================================
       ROTAÇÃO AUTOMÁTICA
    ===================================================== */
    async function rotateToLandscape() {
      try {
        const elem = document.getElementById("playerModal");
        if (elem.requestFullscreen) await elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
      } catch(e) { console.warn("Fullscreen não suportado:", e); }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch(e) { console.warn("Rotação de tela não suportada:", e); }
    }

    async function unlockRotation() {
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch(e) {}
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      } catch(e) {}
    }

    /* =====================================================
       TOGGLE DO BOTÃO VOLTAR
    ===================================================== */
    function toggleCloseButton() {
      const btn = document.getElementById("closePlayer");
      buttonVisible = !buttonVisible;
      if (buttonVisible) {
        btn.classList.add("visible");
      } else {
        btn.classList.remove("visible");
      }
    }

    /* =====================================================
       PLAYER
    ===================================================== */
    function isHlsUrl(url) {
      return /\.m3u8(?:$|[?#])/i.test(String(url || ""));
    }

    async function playVideo(url, name) {
      if (!url) return;
      const modal = document.getElementById("playerModal");
      const video = document.getElementById("video");
      modal.style.display = "block";

      // Reseta o botão voltar (invisível ao abrir)
      buttonVisible = false;
      document.getElementById("closePlayer").classList.remove("visible");

      // GIRA A TELA AUTOMATICAMENTE AO DAR PLAY
      await rotateToLandscape();

      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute("src");
      video.load();

      if (isHlsUrl(url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
        hls.on(Hls.Events.ERROR, (event, data) => { console.error("Erro HLS:", data); });
      } else if (isHlsUrl(url) && video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(() => {});
      } else {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    async function closePlayer() {
      const modal = document.getElementById("playerModal");
      const video = document.getElementById("video");
      video.pause();
      video.removeAttribute("src");
      video.load();
      if (hls) { hls.destroy(); hls = null; }
      modal.style.display = "none";
      document.getElementById("closePlayer").classList.remove("visible");
      buttonVisible = false;
      await unlockRotation();
    }

    /* =====================================================
       SALVAR / CARREGAR LOCAL
    ===================================================== */
    function saveLocal() {
      try { localStorage.setItem("renato_iptv_list", JSON.stringify(list)); }
      catch (error) { console.error("Erro ao salvar local:", error); }
    }

    function loadLocal() {
      try {
        const saved = localStorage.getItem("renato_iptv_list");
        if (!saved) return false;
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
          list = parsed;
          updateHero();
          updateView();
          return true;
        }
      } catch (error) { console.error("Erro ao carregar lista local:", error); }
      return false;
    }

    /* =====================================================
       CARREGAR DEMO
    ===================================================== */
    function loadDemo() {
      const parsed = parseM3U(DEMO);
      if (parsed.length) { list = parsed; updateHero(); updateView(); }
    }

    /* =====================================================
       CARREGAR TEXTO M3U
    ===================================================== */
    async function loadM3UText(text) {
      const parsed = parseM3U(text);
      if (!parsed.length) {
        alert("Não foi possível encontrar conteúdos nessa lista M3U.");
        return;
      }
      list = parsed;
      saveLocal();
      updateHero();
      updateView();
      closeM3UModal();
      alert(`${parsed.length} itens carregados com sucesso.`);
    }

    /* =====================================================
       CARREGAR URL M3U
    ===================================================== */
    async function loadM3UUrl(url) {
      if (!url) { alert("Digite uma URL M3U."); return; }
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        await loadM3UText(text);
      } catch (error) {
        console.warn("Falha direta:", error);
        try {
          const proxy = "https://corsproxy.io/?" + encodeURIComponent(url);
          const response = await fetch(proxy);
          if (!response.ok) throw new Error("Proxy HTTP " + response.status);
          const text = await response.text();
          await loadM3UText(text);
        } catch (proxyError) {
          console.error(proxyError);
          alert("Não foi possível carregar a lista. O servidor da M3U pode estar bloqueando acesso externo (CORS) ou a URL pode estar inválida.");
        }
      }
    }

    /* =====================================================
       ARQUIVO M3U
    ===================================================== */
    function loadM3UFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(event) { await loadM3UText(event.target.result); };
      reader.onerror = function() { alert("Erro ao ler o arquivo."); };
      reader.readAsText(file);
    }

    /* =====================================================
       MODAL
    ===================================================== */
    function openM3UModal() { document.getElementById("m3uModal").style.display = "flex"; }
    function closeM3UModal() { document.getElementById("m3uModal").style.display = "none"; }

    /* =====================================================
       AUTENTICAÇÃO SIMPLIFICADA
    ===================================================== */
    let isSignup = false;

    function showAuthMessage(message) {
      document.getElementById("authMessage").textContent = message || "";
    }

    async function handleAuth() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAuthMessage("Informe e-mail e senha.");
        return;
      }

      currentUser = { id: "local_" + Date.now(), email: email };
      
      if (isSignup) {
        showAuthMessage("Conta criada localmente! Entrando...");
        setTimeout(() => { showApp(); }, 800);
      } else {
        showApp();
      }
    }

    /* =====================================================
       MOSTRAR APP
    ===================================================== */
    async function showApp() {
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("app").style.display = "block";

      const localLoaded = loadLocal();
      if (!localLoaded) {
        loadDemo();
      }
    }

    /* =====================================================
       LOGOUT
    ===================================================== */
    async function logout() {
      currentUser = null;
      list = [];
      document.getElementById("app").style.display = "none";
      document.getElementById("authScreen").style.display = "flex";
      document.getElementById("authMessage").textContent = "";
    }

    /* =====================================================
       EVENTOS
    ===================================================== */
    document.getElementById("authButton").addEventListener("click", handleAuth);

    document.getElementById("authSwitch").addEventListener("click", () => {
      isSignup = !isSignup;
      document.getElementById("authButton").textContent = isSignup ? "Criar conta" : "Entrar";
      document.getElementById("authSwitch").textContent = isSignup ? "Já tenho uma conta" : "Criar uma conta";
      showAuthMessage("");
    });

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("addListBtn").addEventListener("click", openM3UModal);
    document.getElementById("closeM3u").addEventListener("click", closeM3UModal);

    document.getElementById("loadM3u").addEventListener("click", async () => {
      const url = document.getElementById("m3uUrl").value.trim();
      const file = document.getElementById("m3uFile").files[0];
      if (file) {
        loadM3UFile(file);
      } else {
        await loadM3UUrl(url);
      }
    });

    document.getElementById("searchInput").addEventListener("input", event => {
      searchTerm = event.target.value;
      updateView();
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        updateView();
      });
    });

    document.getElementById("heroPlay").addEventListener("click", () => {
      if (list.length) playVideo(list[0].url, list[0].name);
    });

    document.getElementById("password").addEventListener("keydown", event => {
      if (event.key === "Enter") handleAuth();
    });

    /* =====================================================
       CLIQUES NA TELA DO PLAYER - MOSTRA/ESCONDE BOTÃO
    ===================================================== */
    // Clique em qualquer lugar da tela do player (exceto no botão)
    document.getElementById("playerModal").addEventListener("click", function(event) {
      // Se o clique foi no próprio botão, não alterna (deixa o botão agir)
      if (event.target.id === "closePlayer") return;
      toggleCloseButton();
    });

    // Clique no botão voltar (fecha o player)
    document.getElementById("closePlayer").addEventListener("click", function(event) {
      event.stopPropagation(); // evita que o clique "vaze" para o player
      closePlayer();
    });

    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */
    console.log("RENATO IPTV carregado - Modo Local (sem API Key)");
  </script>
</body>
</html>
