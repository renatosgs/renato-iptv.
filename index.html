<!DOCTYPE html>

      --text: #fff;

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { overflow-x: hidden; }
    button, input { font-family: inherit; }
    button { cursor: pointer; }

      inset: 0;
      z-index: 9999;
      background: linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.92)),

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      background: rgba(20,20,20,.96);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 20px 70px rgba(0,0,0,.6);
    }

    .auth-logo {
      text-align: center;
      color: var(--red);
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .auth-box input {
      width: 100%;
      height: 46px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #111;
      color: #fff;
      padding: 0 13px;
      margin-bottom: 12px;
      outline: none;
    }

    .auth-box input:focus { border-color: var(--red); }

    .auth-btn {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 7px;
      background: var(--red);
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .auth-btn:hover { filter: brightness(1.1); }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; }

    .auth-switch {
      text-align: center;
      color: #aaa;
      margin-top: 18px;
      font-size: 13px;
    }

    .auth-switch span {
      color: var(--red);
      cursor: pointer;
      font-weight: bold;
    }

    #authMessage {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      color: #ff7777;
      min-height: 18px;
    }

    /* ========== APP ========== */
    #app { display: none; min-height: 100vh; }

    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      z-index: 1000;
      background: rgba(10,10,10,.97);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #252525;
    }

    .logo { color: var(--red); font-size: 20px; font-weight: 900; white-space: nowrap; }

    .nav-actions { display: flex; align-items: center; gap: 7px; }

    .nav-btn {

      color: white;
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .nav-btn:hover { background: #2d2d2d; }
    .nav-btn.primary { background: var(--red); border-color: var(--red); }

    /* ========== SEARCH ========== */
    .search-area {
      position: fixed;
      top: 60px; left: 0; right: 0;
      z-index: 900;
      background: #111;
      padding: 8px 12px;
      border-bottom: 1px solid #252525;
    }

    #searchInput {
      width: 100%;
      max-width: 650px;
      display: block;
      margin: auto;
      height: 40px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #202020;
      color: #fff;
      padding: 0 17px;
      outline: none;

    #searchInput:focus { border-color: var(--red); }

    .hero {

      position: relative;
      overflow: hidden;
    }

    .hero-content { max-width: 650px; z-index: 2; }

    .hero-title {
      font-size: clamp(28px, 5vw, 58px);
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 3px 15px #000;
    }

    .hero-description { color: #ddd; font-size: 14px; margin-bottom: 18px; }

    .hero-play {
      background: white;
      color: #111;
      border: none;
      border-radius: 5px;
      padding: 11px 20px;
      font-weight: bold;
      font-size: 14px;
    }

    /* ========== TABS ========== */
    .tabs {
      position: sticky;
      top: 108px;
      z-index: 800;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 12px;
      background: rgba(20,20,20,.97);
      border-bottom: 1px solid #292929;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      border: 1px solid #383838;
      background: #222;
      color: #bbb;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .tab.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* ========== CONTENT ========== */
    #content { width: 100%; padding-top: 8px; contain: content; }
    .section { width: 100%; margin-bottom: 10px; }

    .section-title {
      padding: 12px 12px 9px;
      font-size: 19px;
      font-weight: 800;
    }

    .section-title span { color: var(--red); }

    /* ========== GRADE ========== */
    .grid {
      width: 100%;
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 10px;
      padding: 0 10px 25px;
      align-items: start;
    }

    @media (min-width: 601px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        gap: 12px;
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (min-width: 901px) {
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; gap: 14px; }
    }

    @media (min-width: 1400px) {
      .grid { grid-template-columns: repeat(8, minmax(0, 1fr)) !important; }
    }

    /* ========== CARD ========== */
    .card {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d2d2d;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      position: relative;
      cursor: pointer;
      content-visibility: auto;
      contain-intrinsic-size: 220px;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #555;
      box-shadow: 0 8px 25px rgba(0,0,0,.45);
    }

    .card-img {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 2.7;
      background: #111;
      object-fit: cover;

    .card-info { padding: 8px; min-height: 53px; }

    .card-title {
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-category {
      color: #888;
      font-size: 10px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .badge {

      top: 6px; left: 6px;
      background: var(--red);
      color: white;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      padding: 4px 6px;

    /* =====================================================
       NORMALIZAÇÃO / ESCAPE
    ===================================================== */
    function normalizeText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =====================================================
       CATEGORIA
    ===================================================== */
    function detectCategory(name, group) {
      const text = normalizeText(String(name || "") + " " + String(group || ""));

      if (text.includes("novela")) return "novelas";

      if (
        text.includes("serie") ||
        text.includes("series") ||
        text.includes("temporada") ||
        text.includes("episodio") ||
        /s\d{1,2}e\d{1,2}/i.test(text)
      ) return "series";

      if (
        text.includes("filme") ||
        text.includes("filmes") ||
        text.includes("movie") ||
        text.includes("movies") ||
        text.includes("film") ||
        text.includes("vod")
      ) return "filmes";

      return "canais";
    }

    /* =====================================================
       PREPARAR ITEM
    ===================================================== */
    function prepareItem(item) {
      const name = String(item.name || "Sem nome");
      const group = String(item.group || "");

      item.name = name;
      item.group = group;
      item.cat = item.cat || detectCategory(name, group);
      item.searchText = normalizeText(name + " " + group);

      return item;
    }

    function prepareList(data) {
      if (!Array.isArray(data)) return [];

      return data
        .filter(item => item && item.url)
        .map(prepareItem);
    }

    /* =====================================================
       PARSER M3U — CORRIGIDO
       - Ignora #EXTVLCOPT, #EXTGRP, #KODIPROP, etc.
       - Trata corretamente fim de bloco
    ===================================================== */
    function parseM3U(text) {
      const lines = String(text || "").split(/\r?\n/);
      const result = [];
      let item = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // Diretivas que antecedem um novo item
        if (line.toUpperCase().startsWith("#EXTINF:")) {
          const logoMatch = line.match(/tvg-logo\s*=\s*["']([^"']*)["']/i);
          const groupMatch = line.match(/group-title\s*=\s*["']([^"']*)["']/i);
          const comma = line.indexOf(",");

          const name = comma !== -1
            ? line.substring(comma + 1).trim()
            : "Sem nome";

          item = {
            name: name || "Sem nome",
            logo: logoMatch ? logoMatch[1] : "",
            group: groupMatch ? groupMatch[1] : "",
            cat: detectCategory(name, groupMatch ? groupMatch[1] : ""),
            url: ""
          };

          continue;
        }

        // Qualquer outra linha de comentário/diretiva:
        // se não temos item ativo, ignora; se temos, também ignora
        // (mas NÃO fecha o item — só fecha quando vem URL).
        if (line.startsWith("#")) {
          continue;
        }

        // Linha de URL
        if (item && !line.startsWith("#")) {
          item.url = line;

          if (item.url) {
            result.push(prepareItem({ ...item }));
          }

          item = null;
        } else if (!item) {
          // URL solta sem EXTINF anterior — ignora
          continue;
        }
      }

      return result;
    }

    /* =====================================================
       CARD — CORRIGIDO
       Recebe o índice já pronto (evita indexOf O(n²))
    ===================================================== */
    function createCard(item, index) {
      const logo = item.logo ||
        "https://dummyimage.com/300x450/222/ffffff&text=RENATO+IPTV";

      const badge = item.cat === "canais"
        ? "LIVE"
        : item.cat.toUpperCase();

      return `
        <div class="card" data-index="${index}">
          <div class="badge">${escapeHtml(badge)}</div>
          <img
            class="card-img"
            src="${escapeHtml(logo)}"
            alt="${escapeHtml(item.name)}"
            loading="lazy"
            decoding="async"
            onerror="this.onerror=null;this.src='https://dummyimage.com/300x450/222/ffffff&text=IPTV';"
          >
          <div class="card-info">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-category">${escapeHtml(item.group || item.cat)}</div>
          </div>
        </div>
      `;
    }

    /* =====================================================
       CATEGORIAS
    ===================================================== */
    const CATEGORIES = [
      { id: "canais", title: "Canais" },
      { id: "filmes", title: "Filmes" },
      { id: "series", title: "Séries" },
      { id: "novelas", title: "Novelas" }
    ];

    /* =====================================================
       RENDER — CORRIGIDO
       Índice calculado uma vez, sem indexOf
    ===================================================== */
    function render(data) {
      const content = document.getElementById("content");

      if (!data.length) {
        content.innerHTML = `
          <div class="empty">
            <strong>Nenhum conteúdo encontrado</strong>
            Tente outra pesquisa ou carregue uma lista M3U.
          </div>
        `;
        return;
      }

      // Mapa url -> índice global (para o clique)
      const indexMap = new Map();
      list.forEach((it, i) => indexMap.set(it.url, i));

      const buildCards = items =>
        items.map(it => {
          const globalIndex = indexMap.get(it.url) ?? -1;
          return createCard(it, globalIndex);
        }).join("");

      let html = "";

      if (currentFilter === "todos") {
        for (const category of CATEGORIES) {
          const items = data.filter(item => item.cat === category.id);
          if (!items.length) continue;

          html += `
            <section class="section">
              <div class="section-title">
                ${category.title} <span>(${items.length})</span>
              </div>
              <div class="grid">${buildCards(items)}</div>
            </section>
          `;
        }
      } else {
        const category = CATEGORIES.find(c => c.id === currentFilter);
        const title = category ? category.title : currentFilter;

        html = `
          <section class="section">
            <div class="section-title">
              ${title} <span>(${data.length})</span>
            </div>
            <div class="grid">${buildCards(data)}</div>
          </section>
        `;
      }

      content.innerHTML = html;
    }

    /* =====================================================
       FILTRAGEM
    ===================================================== */
    function updateView() {
      const normalizedSearch = normalizeText(searchTerm);
      const filter = currentFilter;

      const data = list.filter(item => {
        const categoryOK = filter === "todos" || item.cat === filter;
        if (!categoryOK) return false;
        if (!normalizedSearch) return true;
        return item.searchText.includes(normalizedSearch);
      });

      render(data);
    }

    function scheduleSearch(value) {
      searchTerm = value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(updateView, 80);
    }

    /* =====================================================
       HERO
    ===================================================== */
    function updateHero() {
      const hero = document.getElementById("hero");
      const title = document.getElementById("heroTitle");
      const description = document.getElementById("heroDescription");

      if (!list.length) {
        hero.style.backgroundImage =
          "linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.5)),linear-gradient(135deg,#300,#111)";
        title.textContent = "RENATO IPTV";
        description.textContent = "Sua programação em um só lugar.";
        return;
      }

      const item = list[0];

      if (item.logo) {
        hero.style.backgroundImage = `
          linear-gradient(90deg, rgba(0,0,0,.95), rgba(0,0,0,.5), rgba(0,0,0,.8)),
          url("${item.logo}")
        `;
      }

      title.textContent = item.name;
      description.textContent = item.group || "Conteúdo disponível";
    }

    /* =====================================================
       PLAYER — CORRIGIDO
       - Recuperação de erros HLS
       - Status visual para o usuário
       - Destrói corretamente
    ===================================================== */
    function isHlsUrl(url) {
      return /\.m3u8(?:$|[?#])/i.test(String(url || ""));
    }

    function setPlayerStatus(text) {
      const el = document.getElementById("playerStatus");
      if (!text) {
        el.style.display = "none";
        el.textContent = "";
      } else {
        el.textContent = text;
        el.style.display = "block";
      }
    }

    function playVideo(url, name) {
      if (!url) return;

      const modal = document.getElementById("playerModal");
      const video = document.getElementById("video");
      const title = document.getElementById("playerTitle");

      title.textContent = name || "Reprodução";
      modal.style.display = "flex";

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();

      setPlayerStatus("Carregando...");

      if (isHlsUrl(url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 4
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setPlayerStatus("");
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("Erro HLS:", data);

          if (!data.fatal) return;

          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              setPlayerStatus("Reconectando...");
              hls.startLoad();
              break;

            case Hls.ErrorTypes.MEDIA_ERROR:
              setPlayerStatus("Recuperando mídia...");
              hls.recoverMediaError();
              break;

            default:
              setPlayerStatus("Não foi possível reproduzir este conteúdo.");
              hls.destroy();
              hls = null;
              break;
          }
        });

      } else if (isHlsUrl(url) && video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.addEventListener("loadeddata", () => setPlayerStatus(""), { once: true });
        video.addEventListener("error", () => setPlayerStatus("Não foi possível reproduzir este conteúdo."), { once: true });
        video.play().catch(() => {});

      } else {
        video.src = url;
        video.addEventListener("loadeddata", () => setPlayerStatus(""), { once: true });
        video.addEventListener("error", () => setPlayerStatus("Não foi possível reproduzir este conteúdo."), { once: true });
        video.play().catch(() => {});
      }
    }

    function closePlayer() {
      const modal = document.getElementById("playerModal");
      const video = document.getElementById("video");

      video.pause();
      video.removeAttribute("src");
      video.load();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      setPlayerStatus("");
      modal.style.display = "none";
    }

    /* =====================================================
       SALVAR LOCAL
    ===================================================== */
    function saveLocal() {
      try {
        localStorage.setItem("renato_iptv_list", JSON.stringify(list));
      } catch (error) {
        console.warn("Erro ao salvar local:", error);
      }
    }

    function loadLocal() {
      try {
        const saved = localStorage.getItem("renato_iptv_list");
        if (!saved) return false;

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed) && parsed.length) {
          list = prepareList(parsed);
          updateHero();
          updateView();
          return list.length > 0;
        }
      } catch (error) {
        console.warn("Erro ao carregar local:", error);
      }

      return false;
    }

    /* =====================================================
       NUVEM — CORRIGIDO
       - Retorna boolean indicando sucesso/falha
       - Avisa se payload for muito grande
    ===================================================== */
    async function saveListToCloud() {
      if (!currentUser) return false;

      try {
        const payload = JSON.stringify(list);

        // Limite prático: ~900 KB para evitar erro do Supabase
        if (payload.length > 900_000) {
          console.warn("Lista muito grande para sincronizar:", payload.length, "bytes");
          return false;
        }

        const { error } = await sb
          .from("user_lists")
          .upsert(
            {
              user_id: currentUser.id,
              content: payload,
              updated_at: new Date().toISOString()
            },
            { onConflict: "user_id" }
          );

        if (error) {
          console.warn("Supabase:", error.message);
          return false;
        }

        return true;

      } catch (error) {
        console.warn("Erro Supabase:", error);
        return false;
      }
    }

    async function loadListFromCloud() {
      if (!currentUser || cloudLoading) return false;

      cloudLoading = true;

      try {
        const { data, error } = await sb
          .from("user_lists")
          .select("content")
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if (error) {
          console.warn("Supabase:", error.message);
          return false;
        }

        if (data && data.content) {
          const parsed = typeof data.content === "string"
            ? JSON.parse(data.content)
            : data.content;

          if (Array.isArray(parsed) && parsed.length) {
            list = prepareList(parsed);
            saveLocal();
            updateHero();
            updateView();
            return list.length > 0;
          }
        }
      } catch (error) {
        console.warn("Erro ao carregar Supabase:", error);
      } finally {
        cloudLoading = false;
      }

      return false;
    }

    /* =====================================================
       DEMO
    ===================================================== */
    function loadDemo() {
      const parsed = parseM3U(DEMO);
      if (parsed.length) {
        list = parsed;
        updateHero();
        updateView();
      }
    }

    /* =====================================================
       CARREGAR TEXTO M3U — CORRIGIDO
       Avisa se sincronização falhar
    ===================================================== */
    async function loadM3UText(text) {
      const parsed = parseM3U(text);

      if (!parsed.length) {
        alert("Não foi possível encontrar conteúdos nessa lista M3U.");
        return;
      }

      list = parsed;
      saveLocal();
      updateHero();
      updateView();
      closeM3UModal();

      const synced = await saveListToCloud();

      if (!synced && currentUser) {
        alert(
          `${parsed.length} itens carregados localmente.\n\n` +
          `⚠️ Não foi possível sincronizar com a nuvem ` +
          `(lista grande demais ou falha de rede).`
        );
      } else {
        alert(`${parsed.length} itens carregados com sucesso.`);
      }
    }

    /* =====================================================
       CARREGARgu URL M3U — CORRIGIDO
arde       Múltiplos proxies... com fallback
    =================================");

==================== */
    async function fetchM3     UText(url) {
      // Tent constativa 1: direto
      try {
        const res = await fetch(url, { mode: "cors" });
        if (res.ok) return await res.text();
      } catch (e) {
        console.warn("Falha direta:", e);
      }

      // Proxies de fallback
      const proxies = [
        u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
        u => `https://thingproxy.freeboard.io/fetch/${u}`
      ];

      for (const makeProxy of proxies) {
        try {
          const res = await fetch(makeProxy(url));
          if (!res.ok) continue;

          const text = await res.text();

          // Verifica se veio algo parecido com M3U
          if (text && text.includes("#EXTM3U")) {
            return text;
          }
        } catch (e) {
          console.warn("Falha proxy:", e);
        }
      }

      throw new Error("Não foi possível obter a lista M3U por nenhum método.");
    }

    async function loadM3UUrl(url) {
      if (!url) {
        alert("Digite uma URL M3U.");
        return;
      }

      try {
        const text = await fetchM3UText(url);
        await loadM3UText(text);
      } catch (error) {
        console.error(error);
        alert(
          "Não foi possível carregar a lista. O servidor pode estar " +
          "bloqueando acesso externo (CORS) ou a URL pode estar inválida."
        );
      }
    }

    /* =====================================================
       ARQUIVO M3U
    ===================================================== */
    function loadM3UFile(file) {
      if (!file) return;

      const reader = new FileReader();

      reader.onload = async event => {
        await loadM3UText(event.target.result);
      };

      reader.onerror = () => {
        alert("Erro ao ler o arquivo.");
      };

      reader.readAsText(file);
    }

    /* =====================================================
       MODAL M3U
    ===================================================== */
    function openM3UModal() {
      document.getElementById("m3uModal").style.display = "flex";
    }

    function closeM3UModal() {
      document.getElementById("m3uModal").style.display = "none";
    }

    /* =====================================================
       AUTENTICAÇÃO
    ===================================================== */
    let isSignup = false;

    function showAuthMessage(message) {
      document.getElementById("authMessage").textContent = message || "";
    }

    async function handleAuth() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAuthMessage("Informe e-mail e senha.");
        return;
      }

      showAuthMessage("A button = document.getElementById("authButton");
      button.disabled = true;

      try {
        if (isSignup) {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;

          if (data.user) currentUser = data.user;

          showAuthMessage(
            "Conta criada. Verifique seu e-mail se a confirmação estiver ativada."
          );
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;

          currentUser = data.user;
          await showApp();
        }
      } catch (error) {
        console.error(error);
        showAuthMessage(error.message || "Erro na autenticação.");
      } finally {
        button.disabled = false;
      }
    }

    /* =====================================================
       MOSTRAR APP
    ===================================================== */
    async function showApp() {
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("app").style.display = "block";

      const localLoaded = loadLocal();

      if (!localLoaded) {
        loadDemo();
      }

      if (currentUser) {
        const cloudLoaded = await loadListFromCloud();
        if (cloudLoaded) {
          updateHero();
          updateView();
        }
      }
    }

    /* =====================================================
       LOGOUT
    ===================================================== */
    async function logout() {
      try {
        await sb.auth.signOut();
      } catch (error) {
        console.warn(error);
      }

      currentUser = null;
      list = [];

      document.getElementById("app").style.display = "none";
      document.getElementById("authScreen").style.display = "flex";
    }

    /* =====================================================
       EVENTOS
    ===================================================== */
    document.getElementById("authButton").addEventListener("click", handleAuth);

    document.getElementById("authSwitch").addEventListener("click", () => {
      isSignup = !isSignup;

      document.getElementById("authButton").textContent =
        isSignup ? "Criar conta" : "Entrar";

      document.getElementById("authSwitch").textContent =
        isSignup ? "Já tenho uma conta" : "Criar uma conta";

      showAuthMessage("");
    });

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("addListBtn").addEventListener("click", openM3UModal);
    document.getElementById("closeM3u").addEventListener("click", closeM3UModal);

    document.getElementById("loadM3u").addEventListener("click", async () => {
      const url = document.getElementById("m3uUrl").value.trim();
      const file = document.getElementById("m3uFile").files[0];
      const button = document.getElementById("loadM3u");

      button.disabled = true;

      try {
        if (file) {
          loadM3UFile(file);
        } else {
          await loadM3UUrl(url);
        }
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("searchInput").addEventListener("input", event => {
      scheduleSearch(event.target.value);
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        updateView();
      });
    });

    document.getElementById("closePlayer").addEventListener("click", closePlayer);

    document.getElementById("heroPlay").addEventListener("click", () => {
      if (list.length) {
        playVideo(list[0].url, list[0].name);
      }
    });

    // Event delegation — clique nos cards
    document.getElementById("content").addEventListener("click", event => {
      const card = event.target.closest(".card");
      if (!card) return;

      const index = Number(card.dataset.index);
      const item = list[index];

      if (item && item.url) {
        playVideo(item.url, item.name);
      }
    });

    document.getElementById("password").addEventListener("keydown", event => {
      if (event.key === "Enter") handleAuth();
    });

    document.getElementById("m3uModal").addEventListener("click", event => {
      if (event.target.id === "m3uModal") closeM3UModal();
    });

    /* =====================================================
       SESSÃO — CORRIGIDO
       - Trata SIGNED_OUT
       - Trata token expirado
    ===================================================== */
    async function checkSession() {
      try {
        const { data } = await sb.auth.getSession();

        if (data && data.session) {
          currentUser = data.session.user;
          await showApp();
        }
      } catch (error) {
        console.error("Erro sessão:", error);
      }
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        currentUser = null;
        document.getElementById("app").style.display = "none";
        document.getElementById("authScreen").style.display = "flex";
        return;
      }

      if (event === "TOKEN_REFRESHED" && session) {
        currentUser = session.user;
        return;
      }

      if (session && session.user) {
        currentUser = session.user;
      }
    });

    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */
    checkSession();

  </script>
</body>
