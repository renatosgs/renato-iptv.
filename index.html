let isSignUpMode = false;

/* =========================================
   ESCAPE HTML
========================================= */

function esc(str) {

  return String(str || '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* =========================================
   TROCAR LOGIN / CADASTRO
========================================= */

function toggleAuthMode() {

  isSignUpMode = !isSignUpMode;

  document.getElementById('authTitle').innerText =
    isSignUpMode
      ? 'Criar Conta'
      : 'Entrar na Conta';

  document.getElementById('btnSubmitAuth').innerText =
    isSignUpMode
      ? 'Cadastrar'
      : 'Entrar';

  document.getElementById('authToggleText').innerText =
    isSignUpMode
      ? 'Já possui conta?'
      : 'Novo por aqui?';

  document.getElementById('authToggleLink').innerText =
    isSignUpMode
      ? 'Fazer login'
      : 'Criar uma conta';

  document.getElementById('authMsg').innerText = '';

  document
    .getElementById('authPassword')
    .setAttribute(
      'autocomplete',
      isSignUpMode
        ? 'new-password'
        : 'current-password'
    );

}


/* =========================================
   LOGIN / CADASTRO
========================================= */

async function handleAuth() {

  const email =
    document
      .getElementById('authEmail')
      .value
      .trim();

  const password =
    document
      .getElementById('authPassword')
      .value;

  const msg =
    document.getElementById('authMsg');

  const btn =
    document.getElementById('btnSubmitAuth');


  if (!email || !email.includes('@')) {

    msg.style.color = '#ff4444';

    msg.innerText =
      'Digite um e-mail válido.';

    return;
  }


  if (!password || password.length < 6) {

    msg.style.color = '#ff4444';

    msg.innerText =
      'A senha precisa ter no mínimo 6 caracteres.';

    return;
  }


  btn.disabled = true;

  msg.style.color = '#aaa';

  msg.innerText = 'Processando...';


  try {

    if (isSignUpMode) {

      const {
        data,
        error
      } = await sb.auth.signUp({
        email,
        password
      });


      if (error) {

        msg.style.color = '#ff4444';

        msg.innerText =
          traduzirErroAuth(error);

        return;
      }


      if (!data.session) {

        msg.style.color = '#4CAF50';

        msg.innerText =
          'Conta criada! Verifique seu e-mail para confirmar.';

        document
          .getElementById('authPassword')
          .value = '';

        return;
      }


      msg.style.color = '#4CAF50';

      msg.innerText =
        'Conta criada com sucesso!';

      document
        .getElementById('authOverlay')
        .style.display = 'none';

      await initPlayerApp();

    } else {

      const {
        error
      } = await sb.auth.signInWithPassword({
        email,
        password
      });


      if (error) {

        msg.style.color = '#ff4444';

        msg.innerText =
          traduzirErroAuth(error);

        return;
      }


      document
        .getElementById('authOverlay')
        .style.display = 'none';

      await initPlayerApp();
    }

  } catch (err) {

    console.error(err);

    msg.style.color = '#ff4444';

    msg.innerText =
      'Erro de conexão. Tente novamente.';

  } finally {

    btn.disabled = false;

  }

}


/* =========================================
   TRADUZIR ERROS
========================================= */

function traduzirErroAuth(error) {

  if (!error) {
    return 'Ocorreu um erro.';
  }

  if (
    error.message === 'Invalid login credentials'
  ) {
    return 'E-mail ou senha incorretos.';
  }

  if (
    error.message &&
    error.message.toLowerCase().includes('already registered')
  ) {
    return 'Este e-mail já está cadastrado.';
  }

  return error.message || 'Ocorreu um erro.';

}


/* =========================================
   LOGOUT
========================================= */

async function handleLogout() {

  try {
    await sb.auth.signOut();
  } catch (e) {
    console.warn(e);
  }

  document
    .getElementById('authPassword')
    .value = '';

  currentUser = null;

  location.reload();

}


/* =========================================
   VERIFICAR LOGIN
========================================= */

async function checkAuth() {

  try {

    const {
      data: { session }
    } = await sb.auth.getSession();


    if (session) {

      currentUser = session.user;

      document
        .getElementById('authOverlay')
        .style.display = 'none';

      await initPlayerApp();

    } else {

      document
        .getElementById('authOverlay')
        .style.display = 'flex';

    }


    sb.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === 'SIGNED_OUT' ||
          !session
        ) {

          currentUser = null;

          document
            .getElementById('authOverlay')
            .style.display = 'flex';

        } else if (
          event === 'SIGNED_IN' &&
          session
        ) {

          currentUser = session.user;

        }

      }
    );

  } catch (error) {

    console.error(
      'Erro ao verificar autenticação:',
      error
    );

  }

}


/* =========================================
   CARREGAR LISTA DA NUVEM
========================================= */

async function loadListFromCloud() {

  if (!currentUser) {
    return null;
  }


  try {

    const {
      data,
      error
    } = await sb
      .from('user_lists')
      .select('content')
      .eq('user_id', currentUser.id)
      .maybeSingle();


    if (error) {

      console.warn(
        'Erro ao buscar lista:',
        error.message
      );

      return null;
    }


    return data && data.content
      ? data.content
      : null;

  } catch (e) {

    console.warn(
      'Falha ao carregar lista da nuvem:',
      e
    );

    return null;

  }

}


/* =========================================
   SALVAR LISTA NA NUVEM
========================================= */

async function saveListToCloud(content) {

  if (!currentUser) {
    return;
  }


  try {

    const {
      error
    } = await sb
      .from('user_lists')
      .upsert(
        {
          user_id: currentUser.id,
          content: content,
          updated_at: new Date().toISOString()
        },
        {
          onConflict: 'user_id'
        }
      );


    if (error) {

      console.warn(
        'Erro ao salvar lista:',
        error.message
      );

    }

  } catch (e) {

    console.warn(
      'Falha ao salvar lista na nuvem:',
      e
    );

  }

}

/* =========================================
   INICIAR APP
========================================= */

async function initPlayerApp() {

  let content =
    await loadListFromCloud();


  if (!content) {

    content =
      localStorage.getItem('r_iptv');

  }


  if (!content) {

    content = DEMO;

  }


  list = parse(content);


  if (list.length > 0) {

    hero = list[0];

    document
      .getElementById('bannerTitle')
      .textContent = hero.name;


    if (hero.logo) {

      document
        .getElementById('banner')
        .style.backgroundImage =
          'url("' +
          hero.logo.replace(/"/g, '') +
          '")';

    }

  }


  render(list);

}


/* =========================================
   PARSER M3U
========================================= */

function parse(txt) {

  if (!txt) {
    return [];
  }


  const lines =
    txt.split(/\r?\n/);


  const res = [];

  let item = null;


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i].trim();


    if (!line) {
      continue;
    }


    if (line.startsWith('#EXTINF:')) {

      item = {
        name:'Canal',
        logo:'',
        cat:'canais',
        url:''
      };


      /* LOGO */

      const lg =
        line.match(
          /tvg-logo="([^"]*)"/i
        );

      if (lg) {
        item.logo = lg[1];
      }


      /* GRUPO */

      const gr =
        line.match(
          /group-title="([^"]*)"/i
        );


      const group =
        gr ? gr[1] : '';


      /* NOME */

      const comma =
        line.lastIndexOf(',');


      if (comma !== -1) {

        const nome =
          line
            .substring(comma + 1)
            .trim();

        if (nome) {
          item.name = nome;
        }

      }


      /* CATEGORIA */

      const full =
        (
          item.name +
          ' ' +
          group
        ).toLowerCase();


      if (
        full.includes('novela')
      ) {

        item.cat = 'novelas';

      } else if (
        full.includes('série') ||
        full.includes('serie') ||
        /s\d{1,2}e\d{1,2}/i.test(full)
      ) {

        item.cat = 'series';

      } else if (
        full.includes('filme') ||
        full.includes('movie') ||
        full.includes('film')
      ) {

        item.cat = 'filmes';

      } else {

        item.cat = 'canais';

      }


    } else if (
      !line.startsWith('#') &&
      item
    ) {

      item.url = line;

      if (item.url) {
        res.push(item);
      }

      item = null;

    }

  }


  return res;

}


/* =========================================
   CRIAR CARD
========================================= */

function buildCard(i) {

  const safeName =
    esc(i.name);


  const safeLogo =
    i.logo
      ? esc(i.logo)
      : 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400';


  return `
    <div
      class="card"
      data-url="${esc(encodeURI(i.url))}"
      data-name="${safeName}"
    >

      <span class="card-badge">
        ${esc(i.cat.toUpperCase())}
      </span>

      <img
        class="card-img"
        src="${safeLogo}"
        loading="lazy"
        onerror="
          this.onerror=null;
          this.src='https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400';
        "
      >

      <div class="card-title">
        ${safeName}
      </div>

    </div>
  `;

}


/* =========================================
   RENDERIZAR
========================================= */

function render(data) {

  const div =
    document.getElementById('content');


  div.innerHTML = '';


  if (
    !data ||
    data.length === 0
  ) {

    div.innerHTML =
      '<p style="padding:30px;text-align:center;color:#777;">Nenhum conteúdo encontrado.</p>';

    return;

  }


  /* FILTRO ESPECÍFICO */

  if (
    currentFilter !== 'todos'
  ) {

    div.innerHTML +=
      '<div class="section-title">' +
      data.length +
      ' itens encontrados</div>' +

      '<div class="grid">' +
      data.map(buildCard).join('') +
      '</div>';


  } else {

    /* TODOS */

    const cats = [

      {
        id:'canais',
        title:'📺 Canais ao Vivo'
      },

      {
        id:'filmes',
        title:'🍿 Filmes'
      },

      {
        id:'series',
        title:'🎬 Séries'
      },

      {
        id:'novelas',
        title:'🌹 Novelas'
      }

    ];


    cats.forEach(c => {

      const sub =
        data.filter(
          i => i.cat === c.id
        );


      if (sub.length) {

        div.innerHTML +=
          '<div class="section-title">' +
          c.title +
          ' (' +
          sub.length +
          ')</div>' +

          '<div class="grid">' +
          sub.map(buildCard).join('') +
          '</div>';

      }

    });

  }


  /* EVENTO DOS CARDS */

  div
    .querySelectorAll('.card')
    .forEach(card => {

      card.addEventListener(
        'click',
        () => {

          play(
            card.getAttribute('data-url'),
            card.getAttribute('data-name')
          );

        }
      );

    });

}


/* =========================================
   FILTRO
========================================= */

function filterCat(cat, btn) {

  currentFilter = cat;


  document
    .querySelectorAll('.tab')
    .forEach(
      b => b.classList.remove('active')
    );


  btn.classList.add('active');


  render(
    cat === 'todos'
      ? list
      : list.filter(
          i => i.cat === cat
        )
  );

}


/* =========================================
   BUSCA
========================================= */

function handleSearch(val) {

  val =
    val.trim().toLowerCase();


  let pool =
    currentFilter === 'todos'
      ? list
      : list.filter(
          i => i.cat === currentFilter
        );


  if (!val) {

    render(pool);

    return;

  }


  render(
    pool.filter(
      i =>
        i.name
          .toLowerCase()
          .includes(val)
    )
  );

}


/* =========================================
   PLAYER
========================================= */

function play(url, name) {

  try {
    url = decodeURI(url);
  } catch (e) {}


  document
    .getElementById('playerTitle')
    .textContent =
      name || 'Reproduzindo';


  document
    .getElementById('playerModal')
    .classList.add('active');


  const v =
    document.getElementById('videoPlayer');


  if (hls) {

    hls.destroy();

    hls = null;

  }


  v.pause();

  v.removeAttribute('src');

  v.load();


  /*
    HLS
  */

  if (
    url.includes('.m3u8') &&
    window.Hls &&
    Hls.isSupported()
  ) {

    hls = new Hls();

    hls.loadSource(url);

    hls.attachMedia(v);


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      () => {

        v.play().catch(
          () => {}
        );

      }
    );


    hls.on(
      Hls.Events.ERROR,
      (event, data) => {

        console.warn(
          'Erro HLS:',
          data
        );

      }
    );


  } else {

    v.src = url;

    v.play().catch(
      () => {}
    );

  }

}


/* =========================================
   PLAYER PRINCIPAL
========================================= */

function playHero() {

  if (hero) {

    play(
      hero.url,
      hero.name
    );

  }

}


/* =========================================
   FECHAR PLAYER
========================================= */

function closePlayer() {

  const v =
    document.getElementById('videoPlayer');


  v.pause();

  v.removeAttribute('src');

  v.load();


  if (hls) {

    hls.destroy();

    hls = null;

  }


  document
    .getElementById('playerModal')
    .classList.remove('active');

}


/* =========================================
   M3U
========================================= */

function openM3U() {

  document
    .getElementById('modalM3U')
    .classList.add('active');

}


function closeM3U() {

  document
    .getElementById('modalM3U')
    .classList.remove('active');

}


/* =========================================
   CARREGAR URL M3U
========================================= */

async function loadUrl() {

  const u =
    document
      .getElementById('urlM3U')
      .value
      .trim();


  if (!u) {

    alert(
      'Insira a URL da lista M3U.'
    );

    return;

  }


  try {

    let text = '';


    try {

      const r =
        await fetch(u);

      if (!r.ok) {
        throw new Error(
          'HTTP ' + r.status
        );
      }

      text =
        await r.text();


    } catch (e) {

      const proxy =
        'https://corsproxy.io/?' +
        encodeURIComponent(u);


      const r =
        await fetch(proxy);


      if (!r.ok) {

        throw new Error(
          'Não foi possível baixar a lista.'
        );

      }


      text =
        await r.text();

    }


    if (
      !text ||
      !text.includes('#EXT')
    ) {

      alert(
        'A URL não parece ser uma lista M3U válida.'
      );

      return;

    }


    await saveList(text);

    closeM3U();


  } catch (e) {

    console.error(e);

    alert(
      'Erro ao baixar a lista M3U. Tente carregar o arquivo .m3u diretamente.'
    );

  }

}


/* =========================================
   UPLOAD ARQUIVO
========================================= */

function uploadFile(e) {

  const f =
    e.target.files[0];


  if (!f) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    async ev => {

      const content =
        ev.target.result;


      if (
        !content ||
        !content.includes('#EXT')
      ) {

        alert(
          'O arquivo não parece ser uma lista M3U válida.'
        );

        return;

      }


      await saveList(content);

      closeM3U();

    };


  reader.onerror = () => {

    alert(
      'Não foi possível ler o arquivo.'
    );

  };


  reader.readAsText(f);

}


/* =========================================
   SALVAR LISTA
========================================= */

async function saveList(txt) {

  try {

    localStorage.setItem(
      'r_iptv',
      txt
    );

  } catch (e) {

    console.warn(
      'Não foi possível salvar localmente:',
      e
    );

  }


  await saveListToCloud(txt);


  list =
    parse(txt);


  if (list.length > 0) {

    hero =
      list[0];


    document
      .getElementById('bannerTitle')
      .textContent =
        hero.name;


    if (hero.logo) {

      document
        .getElementById('banner')
        .style.backgroundImage =
          'url("' +
          hero.logo.replace(/"/g, '') +
          '")';

    }

  }


  currentFilter = 'todos';


  document
    .querySelectorAll('.tab')
    .forEach(
      b => b.classList.remove('active')
    );


  const todos =
    document.querySelector('.tab');


  if (todos) {
    todos.classList.add('active');
  }


  render(list);

}
