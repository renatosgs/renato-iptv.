<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Renato IPTV</title>

  <!-- Bibliotecas: Hls.js para os vídeos e Supabase para Login -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { 
      --red: #E50914; 
      --dark: #141414; 
      --card: #1f1f1f; 
      --text-muted: #888;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background:var(--dark); color:#fff; min-height:100vh; overflow-x:hidden; padding-bottom:50px; }
    
    /* Navbar */
    .navbar { position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:#141414; z-index:100; border-bottom:1px solid #222; }
    .logo { font-size:20px; font-weight:900; color:var(--red); letter-spacing:1px; display:flex; align-items:center; gap:5px; }
    .logo span { color:#fff; font-size:11px; background:var(--red); padding:2px 6px; border-radius:3px; }
    .nav-actions { display:flex; align-items:center; gap:8px; }
    .btn-m3u { background:var(--red); color:#fff; border:none; padding:7px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:12px; }
    .btn-logout { background:#2a2a2a; color:#ccc; border:1px solid #444; padding:6px 10px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; }
    
    /* Barra de Busca */
    .search-container { padding: 10px 16px; background: #141414; margin-top: 60px; }
    .search-bar { width:100%; background:#222; border:1px solid #333; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; outline:none; }
    .search-bar:focus { border-color:var(--red); }

    /* Banner Principal */
    .banner { height:45vh; min-height:260px; background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:20px; position:relative; }
    .banner-overlay { position:absolute; inset:0; background:linear-gradient(0deg, #141414 0%, rgba(20,20,20,0.5) 60%, transparent 100%); }
    .banner-content { position:relative; z-index:2; max-width:600px; }
    .banner-title { font-size:24px; font-weight:900; margin-bottom:6px; text-shadow:0 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size:13px; color:#ccc; margin-bottom:12px; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
    .btn-play { background:#fff; color:#000; border:none; padding:9px 20px; font-weight:bold; border-radius:4px; cursor:pointer; font-size:14px; }

    /* Abas de Categorias */
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 16px; background:#181818; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { padding:7px 15px; background:#252525; border-radius:20px; font-size:13px; cursor:pointer; white-space:nowrap; border:none; color:#ccc; font-weight:500; }
    .tab.active { background:var(--red); color:#fff; font-weight:bold; }

    /* Seções e Carrosséis */
    .section-title { font-size:17px; font-weight:bold; padding:16px 16px 8px; color:#eee; }
    .carousel { display:flex; gap:12px; overflow-x:auto; padding:0 16px 16px; scrollbar-width:none; }
    .carousel::-webkit-scrollbar { display:none; }
    .card { flex:0 0 140px; height:210px; background:var(--card); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; position:relative; }
    .card-img { width:100%; height:140px; object-fit:cover; background:#262626; }
    .card-badge { position:absolute; top:6px; left:6px; font-size:9px; background:var(--red); color:#fff; padding:2px 5px; border-radius:3px; font-weight:bold; }
    .card-title { font-size:12px; font-weight:bold; padding:8px; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* Player Modal */
    .player-modal { position:fixed; inset:0; background:#000; z-index:3000; display:none; flex-direction:column; }
    .player-modal.active { display:flex; }
    .player-header { height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:#141414; }
    .btn-close { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
    video { width:100%; flex:1; background:#000; }

    /* Modal M3U */
    .modal-m3u { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:3500; display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-m3u.active { display:flex; }
    .box-m3u { background:#222; padding:20px; border-radius:8px; width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px; }
    .input-m3u { background:#333; border:1px solid #444; color:#fff; padding:10px; border-radius:4px; width:100%; outline:none; }

    /* TELA DE LOGIN (SUPABASE) */
    .auth-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:5000;
      display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .auth-box {
      background:#1a1a1a; padding:30px 24px; border-radius:8px; width:100%;
      max-width:360px; display:flex; flex-direction:column; gap:14px; border:1px solid #2d2d2d;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .auth-logo { text-align:center; font-size:24px; font-weight:900; color:var(--red); letter-spacing:1px; margin-bottom:4px; }
    .auth-logo span { background:var(--red); color:#fff; font-size:12px; padding:2px 6px; border-radius:3px; }
    .auth-title { text-align:center; font-size:17px; font-weight:bold; color:#ddd; margin-bottom:8px; }
    .auth-input {
      background:#262626; border:1px solid #3d3d3d; color:#fff; padding:12px;
      border-radius:4px; font-size:14px; outline:none; width:100%;
    }
    .auth-input:focus { border-color:var(--red); }
    .btn-auth-submit {
      background:var(--red); color:#fff; border:none; padding:12px;
      border-radius:4px; font-weight:bold; cursor:pointer; font-size:15px; margin-top:4px;
    }
    .auth-msg { font-size:12px; text-align:center; min-height:16px; }
    .auth-toggle { text-align:center; font-size:13px; color:#aaa; margin-top:8px; }
    .auth-toggle a { color:#fff; font-weight:bold; text-decoration:underline; cursor:pointer; }
  </style>
</head>
<body>

  <!-- Tela Obrigatória de Login -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
      <div class="auth-logo">RENATO <span>IPTV</span></div>
      <div id="authTitle" class="auth-title">Entrar na Conta</div>
      
      <input type="email" id="authEmail" class="auth-input" placeholder="E-mail" autocomplete="email">
      <input type="password" id="authPassword" class="auth-input" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password">
      
      <button class="btn-auth-submit" id="btnSubmitAuth" onclick="handleAuth()">Entrar</button>
      
      <div id="authMsg" class="auth-msg"></div>

      <div class="auth-toggle">
        <span id="authToggleText">Novo por aqui?</span>
        <a id="authToggleLink" onclick="toggleAuthMode()">Criar uma conta</a>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">RENATO <span>IPTV</span></div>
    <div class="nav-actions">
      <button class="btn-m3u" onclick="openM3U()">+ Lista</button>
      <button class="btn-logout" onclick="handleLogout()" title="Sair da conta">Sair</button>
    </div>
  </div>

  <!-- Campo de Busca -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar canais, filmes, séries..." oninput="handleSearch(this.value)">
  </div>

  <!-- Banner Destaque -->
  <div class="banner" id="banner">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <div class="banner-title" id="bannerTitle">Renato IPTV</div>
      <div class="banner-desc">Assista canais ao vivo, filmes, séries e novelas.</div>
      <button class="btn-play" onclick="playHero()">▶ Assistir</button>
    </div>
  </div>

  <!-- Abas de Filtro -->
  <div class="tabs">
    <button class="tab active" onclick="filterCat('todos', this)">Todos</button>
    <button class="tab" onclick="filterCat('canais', this)">📺 Canais</button>
    <button class="tab" onclick="filterCat('filmes', this)">🍿 Filmes</button>
    <button class="tab" onclick="filterCat('series', this)">🎬 Séries</button>
    <button class="tab" onclick="filterCat('novelas', this)">🌹 Novelas</button>
  </div>

  <!-- Container de Listas -->
  <div id="content"></div>

  <!-- Player Modal -->
  <div class="player-modal" id="playerModal">
    <div class="player-header">
      <span id="playerTitle" style="font-size:14px; font-weight:bold;">Reproduzindo</span>
      <button class="btn-close" onclick="closePlayer()">✕</button>
    </div>
    <video id="videoPlayer" controls autoplay playsinline></video>
  </div>

  <!-- Modal M3U -->
  <div class="modal-m3u" id="modalM3U">
    <div class="box-m3u">
      <h3 style="font-size:16px;">Carregar Lista M3U / M3U8</h3>
      <input type="url" id="urlM3U" class="input-m3u" placeholder="Cole o link da lista M3U">
      <input type="file" id="fileM3U" accept=".m3u,.m3u8,.txt" onchange="uploadFile(event)">
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn-m3u" style="background:#444;" onclick="closeM3U()">Fechar</button>
        <button class="btn-m3u" onclick="loadUrl()">Carregar</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÃO DO SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://tcsikxqgyyvewqwfudcu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc2lreHFneXl2ZXdxd2Z1ZGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTY1NDgsImV4cCI6MjEwNTM3MjU0OH0.xwEoEjEpteTrSKJ-dOPszpwpQ-p5lgZphNZ93NyUoxg';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUpMode = false;
    let list = [];
    let currentFilter = 'todos';
    let hls = null;
    let hero = null;

    // Alternar entre Entrar e Cadastrar
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authTitle').innerText = isSignUpMode ? 'Criar Conta' : 'Entrar na Conta';
      document.getElementById('btnSubmitAuth').innerText = isSignUpMode ? 'Cadastrar' : 'Entrar';
      document.getElementById('authToggleText').innerText = isSignUpMode ? 'Já possui conta?' : 'Novo por aqui?';
      document.getElementById('authToggleLink').innerText = isSignUpMode ? 'Fazer login' : 'Criar uma conta';
      document.getElementById('authMsg').innerText = '';
    }

    // Processar Login ou Cadastro
    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const msg = document.getElementById('authMsg');

      if (!email || !password) {
        msg.style.color = '#ff4444';
        msg.innerText = 'Preencha o e-mail e a senha.';
        return;
      }

      msg.style.color = '#aaa';
      msg.innerText = 'Processando...';

      if (isSignUpMode) {
        // Criar Conta
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) {
          msg.style.color = '#ff4444';
          msg.innerText = error.message;
        } else {
          msg.style.color = '#4CAF50';
          msg.innerText = 'Conta criada com sucesso! Entrando...';
          setTimeout(() => {
            document.getElementById('authOverlay').style.display = 'none';
            initPlayerApp();
          }, 800);
        }
      } else {
        // Entrar
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          msg.style.color = '#ff4444';
          msg.innerText = 'E-mail ou senha incorretos.';
        } else {
          document.getElementById('authOverlay').style.display = 'none';
          initPlayerApp();
        }
      }
    }

    // Sair da conta
    async function handleLogout() {
      await sb.auth.signOut();
      location.reload();
    }

    // Verificar se já está logado ao abrir a página
    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById('authOverlay').style.display = 'none';
        initPlayerApp();
      } else {
        document.getElementById('authOverlay').style.display = 'flex';
      }

      sb.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          document.getElementById('authOverlay').style.display = 'flex';
        }
      });
    }

    // ==========================================
    // LÓGICA DO PLAYER IPTV
    // ==========================================
    const DEMO = `#EXTM3U
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400" group-title="Filmes", Big Buck Bunny 4K
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400" group-title="Filmes", Sintel O Filme
https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=400" group-title="Novelas", Novela: Amor e Destino Cap 01
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400" group-title="Novelas", Novela: Terra Dourada Cap 05
https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=400" group-title="Séries", Série: Espaço S01E01
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 tvg-logo="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=400" group-title="Canais", Red Bull TV Ao Vivo
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;

    function initPlayerApp() {
      const saved = localStorage.getItem('r_iptv');
      list = parse(saved || DEMO);
      if (list.length > 0) {
        hero = list[0];
        document.getElementById('bannerTitle').innerText = hero.name;
        if (hero.logo) {
          document.getElementById('banner').style.backgroundImage = 'url(' + hero.logo + ')';
        }
      }
      render(list);
    }

    function parse(txt) {
      if (!txt) return [];
      const lines = txt.split(/\r?\n/);
      const res = [];
      let item = null;
      for (let raw of lines) {
        let l = raw.trim();
        if (!l) continue;
        if (l.startsWith('#EXTINF:')) {
          item = { name: 'Canal', logo: '', cat: 'canais', url: '' };
          const lg = l.match(/tvg-logo="([^"]*)"/i); if (lg) item.logo = lg[1];
          const nm = l.match(/tvg-name="([^"]*)"/i); if (nm) item.name = nm[1];
          const gr = l.match(/group-title="([^"]*)"/i);
          const c = l.lastIndexOf(','); if (c !== -1) item.name = l.substring(c+1).trim() || item.name;
          const full = (item.name + ' ' + (gr ? gr[1] : '')).toLowerCase();
          if (full.includes('novela')) item.cat = 'novelas';
          else if (full.includes('serie') || /s\d{1,2}/i.test(full)) item.cat = 'series';
          else if (full.includes('filme') || l.endsWith('.mp4')) item.cat = 'filmes';
          else item.cat = 'canais';
        } else if (!l.startsWith('#') && item) {
          item.url = l;
          res.push(item);
          item = null;
        }
      }
      return res;
    }

    function render(data) {
      const div = document.getElementById('content');
      div.innerHTML = '';
      if (!data || data.length === 0) {
        div.innerHTML = '<p style="padding:30px; text-align:center; color:#777;">Nenhum canal encontrado.</p>';
        return;
      }
      const cats = [
        { id: 'canais', title: '📺 Canais ao Vivo' },
        { id: 'filmes', title: '🍿 Filmes' },
        { id: 'series', title: '🎬 Séries' },
        { id: 'novelas', title: '🌹 Novelas' }
      ];
      cats.forEach(c => {
        const sub = data.filter(i => i.cat === c.id);
        if (sub.length) {
          div.innerHTML += '<div class="section-title">' + c.title + ' (' + sub.length + ')</div><div class="carousel">' + 
            sub.map(i => `
              <div class="card" onclick="play('${encodeURI(i.url)}', '${escapeQuotes(i.name)}')">
                <span class="card-badge">${i.cat.toUpperCase()}</span>
                <img class="card-img" src="${i.logo || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400'}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400';">
                <div class="card-title">${i.name}</div>
              </div>
            `).join('') + '</div>';
        }
      });
    }

    function filterCat(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(cat === 'todos' ? list : list.filter(i => i.cat === cat));
    }

    function handleSearch(val) {
      val = val.trim().toLowerCase();
      let pool = currentFilter === 'todos' ? list : list.filter(i => i.cat === currentFilter);
      if (!val) { render(pool); return; }
      render(pool.filter(i => i.name.toLowerCase().includes(val)));
    }

    function play(url, name) {
      url = decodeURI(url);
      document.getElementById('playerTitle').innerText = name;
      document.getElementById('playerModal').classList.add('active');
      const v = document.getElementById('videoPlayer');
      if (hls) { hls.destroy(); hls = null; }

      if (url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      } else {
        v.src = url;
        v.play().catch(() => {});
      }
    }

    function playHero() { if (hero) play(hero.url, hero.name); }

    function closePlayer() {
      const v = document.getElementById('videoPlayer');
      v.pause(); v.removeAttribute('src'); v.load();
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById('playerModal').classList.remove('active');
    }

    function openM3U() { document.getElementById('modalM3U').classList.add('active'); }
    function closeM3U() { document.getElementById('modalM3U').classList.remove('active'); }

    async function loadUrl() {
      const u = document.getElementById('urlM3U').value.trim();
      if (!u) return alert('Insira a URL');
      try {
        let text = '';
        try {
          const r = await fetch(u);
          text = await r.text();
        } catch {
          const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(u));
          text = await r.text();
        }
        saveList(text);
        closeM3U();
      } catch {
        alert('Erro ao baixar lista. Tente carregar o arquivo .m3u diretamente.');
      }
    }

    function uploadFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        saveList(ev.target.result);
        closeM3U();
      };
      reader.readAsText(f);
    }

    function saveList(txt) {
      try { localStorage.setItem('r_iptv', txt); } catch(e) {}
      list = parse(txt);
      if (list.length > 0) {
        hero = list[0];
        document.getElementById('bannerTitle').innerText = hero.name;
        if (hero.logo) document.getElementById('banner').style.backgroundImage = 'url(' + hero.logo + ')';
      }
      render(list);
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Inicia checando o login do Supabase
    window.onload = checkAuth;
  </script>
</body>
</html>
